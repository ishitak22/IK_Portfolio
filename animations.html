<script>
(function () {
  // Loaded in <head> so the page-transition listeners below are registered in time.
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isProjectPage = /\/projects\/[^/]+\//.test(location.pathname);

  // Lets CSS hide "reveal" elements only when this script can show them again
  document.documentElement.classList.add('js');

  // --- Home page: fade-ins, count-up numbers, typing effect ----------------
  document.addEventListener('DOMContentLoaded', () => {
    // Fade + rise into view; heatmap rows are staggered
    const reveals = document.querySelectorAll('.reveal');
    reveals.forEach((el) => {
      el.querySelectorAll('tbody tr').forEach((tr, i) => { tr.style.transitionDelay = (i * 60) + 'ms'; });
    });
    const show = (el) => {
      el.classList.add('in-view');
      el.querySelectorAll('.stat-num[data-count]').forEach(countUp);
    };
    if (reduceMotion || !('IntersectionObserver' in window)) {
      reveals.forEach(show);
    } else {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
      }, { threshold: 0.2 });
      reveals.forEach((el) => io.observe(el));
    }

    // Project cards rise into view, staggered across each row of three
    const cards = document.querySelectorAll('.quarto-grid-item');
    if (!reduceMotion && 'IntersectionObserver' in window) {
      const cardIO = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          const card = e.target;
          card.style.transitionDelay = (Number(card.dataset.revealOrder || 0) % 3) * 90 + 'ms';
          card.classList.add('in-view');
          card.addEventListener('transitionend', () => { card.style.transitionDelay = ''; }, { once: true });
          cardIO.unobserve(card);
        });
      }, { threshold: 0.15 });
      cards.forEach((card, i) => {
        card.dataset.revealOrder = i;
        card.classList.add('card-reveal');
        cardIO.observe(card);
      });
    }

    // Projects page: show the category filter as chips above the grid
    const catList = document.querySelector('.projects-page .quarto-listing-category');
    const grid = document.querySelector('.projects-page .quarto-listing');
    if (catList && grid) {
      const bar = document.createElement('div');
      bar.id = 'filter-bar';
      bar.setAttribute('aria-label', 'Filter projects by category');
      bar.appendChild(catList);
      grid.parentNode.insertBefore(bar, grid);
      // Highlight "All" until a category is chosen
      if (!catList.querySelector('.category.active')) {
        const all = catList.querySelector('.category');
        if (all) all.classList.add('active');
      }
      // Chip clicks: let Quarto filter inside a View Transition so cards glide
      bar.addEventListener('click', (e) => {
        const chip = e.target.closest('.category');
        if (!chip || e.viaTransition || reduceMotion || !document.startViewTransition) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        withCardTransition(() => {
          const replay = new MouseEvent('click', { bubbles: true, cancelable: true });
          replay.viaTransition = true;
          chip.dispatchEvent(replay);
        });
      }, true);
    }

    // "Copy email address" button: works for visitors without a mail app
    document.querySelectorAll('.copy-email').forEach((btn) => {
      const label = btn.querySelector('span');
      const icon = btn.querySelector('.bi');
      btn.addEventListener('click', async () => {
        const email = btn.dataset.email;
        try {
          await navigator.clipboard.writeText(email);
        } catch (e) {                         // older browsers
          const t = document.createElement('textarea');
          t.value = email;
          document.body.appendChild(t);
          t.select();
          document.execCommand('copy');
          t.remove();
        }
        label.textContent = 'Copied!';
        icon.className = 'bi bi-check2';
        btn.classList.add('copied');
        clearTimeout(btn._reset);
        btn._reset = setTimeout(() => {
          label.textContent = 'Copy email address';
          icon.className = 'bi bi-clipboard';
          btn.classList.remove('copied');
        }, 2000);
      });
    });

    // Screen readers announce embedded dashboards by their title
    const pageName = (document.querySelector('h1.title') || {}).textContent || document.title;
    document.querySelectorAll('main iframe:not([title])').forEach((f) => {
      f.title = 'Interactive dashboard: ' + pageName.trim();
    });

    // Fixed-size apps (e.g. the D3 map): render at their design width, then
    // scale down to fit so the whole layout is visible at once
    document.querySelectorAll('.embed-scale').forEach((box) => {
      const frame = box.querySelector('iframe');
      if (!frame) return;
      const dw = Number(box.dataset.designWidth);
      const cw = Number(box.dataset.contentWidth || dw);
      const dh = Number(box.dataset.designHeight);
      const fit = () => {
        const s = Math.min(box.clientWidth / cw, 1);
        frame.style.width = dw + 'px';
        frame.style.height = dh + 'px';
        frame.style.transform = 'scale(' + s + ')';
        box.style.height = Math.round(dh * s) + 'px';
      };
      fit();
      window.addEventListener('resize', fit);
    });

    // Hide the "On this page" sidebar while a full-width dashboard is on screen
    const wide = [...document.querySelectorAll('.embed-wide, .column-page')].filter((el) => el.querySelector('iframe'));
    if (wide.length && 'IntersectionObserver' in window) {
      const visible = new Set();
      const wideIO = new IntersectionObserver((entries) => {
        entries.forEach((e) => { e.isIntersecting ? visible.add(e.target) : visible.delete(e.target); });
        document.body.classList.toggle('wide-embed-in-view', visible.size > 0);
      }, { rootMargin: '-60px 0px 0px 0px' });
      wide.forEach((el) => wideIO.observe(el));
    }

    // Numbers count up from 0 to their final value
    function countUp(el) {
      const target = Number(el.dataset.count);
      const prefix = el.dataset.prefix || '';
      const suffix = el.dataset.suffix || '';
      const fmt = (n) => prefix + Math.round(n).toLocaleString('en-AU') + suffix;
      if (reduceMotion || !target) { el.textContent = fmt(target); return; }
      const start = performance.now();
      const dur = 1400;
      (function tick(now) {
        const t = Math.min((now - start) / dur, 1);
        el.textContent = fmt(target * (1 - Math.pow(1 - t, 3)));   // ease-out
        if (t < 1) requestAnimationFrame(tick);
      })(start);
    }

    // Typing effect: type a word, pause, delete, next word
    document.querySelectorAll('.typer[data-words]').forEach((el) => {
      if (reduceMotion) return;                 // keep the first word, no motion
      let words;
      try { words = JSON.parse(el.dataset.words); } catch (e) { return; }
      let w = 0, i = words[0].length, deleting = true;
      el.setAttribute('aria-live', 'off');
      el.textContent = words[0];
      function step() {
        const word = words[w];
        i += deleting ? -1 : 1;
        el.textContent = word.slice(0, i);
        let delay = deleting ? 45 : 85;
        if (!deleting && i === word.length) { deleting = true; delay = 1800; }
        else if (deleting && i === 0) { deleting = false; w = (w + 1) % words.length; delay = 350; }
        setTimeout(step, delay);
      }
      setTimeout(step, 1800);   // show the first word fully before deleting it
    });
  });

  // --- Glass menu bar once scrolled + reading progress bar (project pages) --
  document.addEventListener('DOMContentLoaded', () => {
    const header = document.getElementById('quarto-header');
    let bar = null;
    if (isProjectPage) {
      // Keep the "Projects" tab highlighted while reading an individual project
      const tab = document.querySelector('.navbar-nav .nav-link[href$="projects.html"]');
      if (tab) tab.classList.add('active');
      bar = document.createElement('div');
      bar.id = 'reading-progress';
      document.body.appendChild(bar);
    }

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        if (header) header.classList.toggle('is-scrolled', y > 12);
        if (bar) {
          if (header) bar.style.setProperty('--header-h', header.getBoundingClientRect().bottom + 'px');
          const max = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(y / max, 1) : 0) + ')';
        }
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    if (header) header.addEventListener('transitionend', onScroll); // menu bar finished shrinking
    onScroll();
  });

  // --- Smooth reflow when filtering projects by category -------------------
  // Wraps Quarto's category filter in a same-page View Transition so cards
  // glide to their new positions instead of jumping.
  function withCardTransition(update) {
    const cards = document.querySelectorAll('.quarto-grid-item');
    cards.forEach((c, i) => { c.style.viewTransitionName = 'card-' + (c.dataset.index || i); });
    document.documentElement.classList.add('filtering');
    const t = document.startViewTransition(update);
    t.finished.finally(() => {
      document.documentElement.classList.remove('filtering');
      cards.forEach((c) => { c.style.viewTransitionName = ''; });
    });
  }
  // Tag chips inside each card call window.quartoListingCategory directly
  window.addEventListener('load', () => {
    const original = window.quartoListingCategory;
    if (reduceMotion || typeof original !== 'function' || !document.startViewTransition) return;
    window.quartoListingCategory = function (...args) {
      withCardTransition(() => original.apply(this, args));
    };
  });

  // --- Title morph between a project card and its project page -------------
  // Browsers with cross-page View Transitions fire pageswap/pagereveal;
  // others simply skip this and load pages normally.
  if (reduceMotion) return;

  const NAME = 'project-title';
  const clean = (url) => new URL(url, location.href).pathname.replace(/index\.html$/, '');
  const isProjectPath = (path) => /\/projects\/[^/]+\/$/.test(path);

  function clearNames() {
    document.querySelectorAll('[data-vt-name]').forEach((el) => {
      el.style.viewTransitionName = '';
      el.removeAttribute('data-vt-name');
    });
  }
  function name(el) {
    if (!el) return;
    el.style.viewTransitionName = NAME;
    el.setAttribute('data-vt-name', '');
  }
  // The card title on a listing page that links to `path`
  function cardTitleFor(path) {
    const links = document.querySelectorAll('.quarto-listing a[href], .related-projects a[href]');
    for (const a of links) {
      if (clean(a.href) === path) {
        const item = a.closest('.quarto-post, .quarto-grid-item, .card');
        return item && item.querySelector('.listing-title, .card-title');
      }
    }
    return null;
  }
  const pageTitle = () => document.querySelector('#title-block-header h1.title, header h1.title');

  // Leaving this page: tag the element that should morph
  window.addEventListener('pageswap', (e) => {
    clearNames();
    if (!e.viewTransition || !e.activation || !e.activation.entry) return;
    const to = clean(e.activation.entry.url);
    if (isProjectPath(to)) name(cardTitleFor(to));        // card -> project page
    else if (isProjectPage) name(pageTitle());            // project page -> back to a list
  });

  // Arriving on this page: tag the matching element
  window.addEventListener('pagereveal', (e) => {
    clearNames();
    if (!e.viewTransition || !window.navigation || !navigation.activation || !navigation.activation.from) return;
    const from = clean(navigation.activation.from.url);
    if (isProjectPage) name(pageTitle());                    // arrived from a card (list or "More projects")
    else if (isProjectPath(from)) name(cardTitleFor(from));  // came back to the list
    e.viewTransition.finished.finally(clearNames);
  });
})();
</script>
